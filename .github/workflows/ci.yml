name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas del dominio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        working-directory: packages/shared
        run: npm install --no-workspaces --no-package-lock
      - name: Pruebas (Jest)
        working-directory: packages/shared
        run: npx jest --ci
